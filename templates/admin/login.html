{% extends "base.html" %}
{% block title %}Вход в админ-панель{% endblock %}
{% block content %}
<section class="login-section">
    <div class="container">
        <div class="login-card">
            <h2><i class="fas fa-lock"></i> Вход в систему</h2>
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" required placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>
            <p class="login-hint">По умолчанию: admin / admin123</p>
        </div>
    </div>
</section>
{% endblock %}
