{% extends "base.html" %}
{% block title %}{{ 'Редактировать' if car else 'Добавить' }} автомобиль{% endblock %}
{% block content %}
<section class="admin-section">
    <div class="container">
        <h2 class="section-title">{{ 'Редактировать' if car else 'Добавить' }} автомобиль</h2>
        
        <form method="POST" class="form-card" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label for="brand">Марка *</label>
                    <input type="text" id="brand" name="brand" value="{{ car.brand if car else '' }}" required placeholder="Toyota">
                </div>
                <div class="form-group">
                    <label for="model">Модель *</label>
                    <input type="text" id="model" name="model" value="{{ car.model if car else '' }}" required placeholder="Camry">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="year">Год выпуска *</label>
                    <input type="number" id="year" name="year" value="{{ car.year if car else '2024' }}" required min="1900" max="2030">
                </div>
                <div class="form-group">
                    <label for="price">Цена продажи (₽) *</label>
                    <input type="number" id="price" name="price" value="{{ car.price if car else '' }}" required placeholder="2500000">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="purchase_price">Цена закупки (₽)</label>
                    <input type="number" id="purchase_price" name="purchase_price" value="{{ car.purchase_price if car else '0' }}" placeholder="2000000">
                </div>
                <div class="form-group">
                    <label for="vin">VIN</label>
                    <input type="text" id="vin" name="vin" value="{{ car.vin if car else '' }}" placeholder="XTA210930Y2764290" maxlength="17">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="engine">Двигатель</label>
                    <input type="text" id="engine" name="engine" value="{{ car.engine if car else '' }}" placeholder="2.5L, 200 л.с., АКПП">
                </div>
                <div class="form-group">
                    <label for="color">Цвет</label>
                    <input type="text" id="color" name="color" value="{{ car.color if car else '' }}" placeholder="Чёрный">
                </div>
            </div>
            
            <div class="form-group">
                <label for="status">Статус</label>
                <select id="status" name="status">
                    <option value="available" {% if car and car.status == 'available' %}selected{% endif %}>В наличии</option>
                    <option value="sold" {% if car and car.status == 'sold' %}selected{% endif %}>Продан</option>
                    <option value="reserved" {% if car and car.status == 'reserved' %}selected{% endif %}>Забронирован</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="equipment">Комплектация</label>
                <textarea id="equipment" name="equipment" rows="3" placeholder="Климат-контроль, кожаный салон, подогрев сидений...">{{ car.equipment if car else '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="4" placeholder="Подробное описание автомобиля...">{{ car.description if car else '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="image">Изображение</label>
                {% if car and car.image %}
                <div class="current-image">
                    <img src="{{ url_for('uploaded_file', filename=car.image) }}" alt="Текущее изображение">
                </div>
                {% endif %}
                <input type="file" id="image" name="image" accept="image/*">
                <small class="form-hint">PNG, JPG, GIF (макс. 16MB)</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сохранить</button>
                <a href="{{ url_for('admin_cars') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
