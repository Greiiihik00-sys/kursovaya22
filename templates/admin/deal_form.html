{% extends "base.html" %}
{% block title %}{{ 'Редактировать' if deal else 'Оформить' }} сделку{% endblock %}
{% block content %}
<section class="admin-section">
    <div class="container">
        <h2 class="section-title">{{ 'Редактировать' if deal else 'Оформить' }} сделку</h2>
        
        <form method="POST" class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label for="car_id">Автомобиль *</label>
                    <select id="car_id" name="car_id" required>
                        <option value="">Выберите автомобиль</option>
                        {% for car in cars %}
                        <option value="{{ car.id }}" {% if deal and deal.car_id == car.id %}selected{% endif %}>{{ car.brand }} {{ car.model }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="client_id">Клиент *</label>
                    <select id="client_id" name="client_id" required>
                        <option value="">Выберите клиента</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if deal and deal.client_id == client.id %}selected{% endif %}>{{ client.last_name }} {{ client.first_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="deal_price">Сумма сделки (₽) *</label>
                    <input type="number" id="deal_price" name="deal_price" value="{{ deal.deal_price if deal else '' }}" required placeholder="2500000">
                </div>
                <div class="form-group">
                    <label for="deal_date">Дата сделки *</label>
                    <input type="date" id="deal_date" name="deal_date" value="{{ deal.deal_date if deal else '' }}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="payment_method">Способ оплаты</label>
                    <select id="payment_method" name="payment_method">
                        <option value="cash" {% if deal and deal.payment_method == 'cash' %}selected{% endif %}>Наличные</option>
                        <option value="transfer" {% if deal and deal.payment_method == 'transfer' %}selected{% endif %}>Безналичный перевод</option>
                        <option value="credit" {% if deal and deal.payment_method == 'credit' %}selected{% endif %}>Кредит</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contract_number">Номер договора</label>
                    <input type="text" id="contract_number" name="contract_number" value="{{ deal.contract_number if deal else '' }}" placeholder="ДС-001/2026">
                </div>
            </div>
            
            <div class="form-group">
                <label for="status">Статус</label>
                <select id="status" name="status">
                    <option value="completed" {% if deal and deal.status == 'completed' %}selected{% endif %}>Завершена</option>
                    <option value="pending" {% if deal and deal.status == 'pending' %}selected{% endif %}>В процессе</option>
                    <option value="cancelled" {% if deal and deal.status == 'cancelled' %}selected{% endif %}>Отменена</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="notes">Примечания</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Дополнительная информация...">{{ deal.notes if deal else '' }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сохранить</button>
                <a href="{{ url_for('admin_deals') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
